<!DOCTYPE html>
<html>

<head>
    <title>Edit Clothing</title>
</head>

<body>

    <h1>Edit Clothing</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Clothing Name:</label>
        <input type="text" name="name" value="{{ clothing.name }}" required>
        <br><br>


        <label>Category:</label>

        <select name="category">

            <option value="Top"
                {% if clothing.category == "Top" %}selected{% endif %}>
                Top
            </option>

            <option value="Bottom"
                {% if clothing.category == "Bottom" %}selected{% endif %}>
                Bottom
            </option>

            <option value="Dress"
                {% if clothing.category == "Dress" %}selected{% endif %}>
                Dress
            </option>

            <option value="Outerwear"
                {% if clothing.category == "Outerwear" %}selected{% endif %}>
                Outerwear
            </option>

            <option value="Footwear"
                {% if clothing.category == "Footwear" %}selected{% endif %}>
                Footwear
            </option>

            <option value="Accessory"
                {% if clothing.category == "Accessory" %}selected{% endif %}>
                Accessory
            </option>

        </select>

        <br><br>


        <label>Color:</label>
        <input type="text" name="color" value="{{ clothing.color }}" required>
        <br><br>


        <label>Size:</label>
        <input type="text" name="size" value="{{ clothing.size }}" required>
        <br><br>


        <label>Brand:</label>
        <input type="text" name="brand" value="{{ clothing.brand }}">
        <br><br>


        <!-- SEASON -->

        <label>Season:</label>

        <div>

            <label>
                <input
                    type="checkbox"
                    name="season"
                    value="Summer"
                    {% if "Summer" in clothing.season %}checked{% endif %}
                >
                Summer
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="season"
                    value="Winter"
                    {% if "Winter" in clothing.season %}checked{% endif %}
                >
                Winter
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="season"
                    value="Monsoon"
                    {% if "Monsoon" in clothing.season %}checked{% endif %}
                >
                Monsoon
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="season"
                    value="All Season"
                    {% if "All Season" in clothing.season %}checked{% endif %}
                >
                All Season
            </label>

        </div>

        <br><br>


        <!-- OCCASION -->

        <label>Occasion:</label>

        <div>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Casual"
                    {% if "Casual" in clothing.occasion %}checked{% endif %}
                >
                Casual
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Formal"
                    {% if "Formal" in clothing.occasion %}checked{% endif %}
                >
                Formal
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Party"
                    {% if "Party" in clothing.occasion %}checked{% endif %}
                >
                Party
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="College"
                    {% if "College" in clothing.occasion %}checked{% endif %}
                >
                College
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Office"
                    {% if "Office" in clothing.occasion %}checked{% endif %}
                >
                Office
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Wedding"
                    {% if "Wedding" in clothing.occasion %}checked{% endif %}
                >
                Wedding
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Sports"
                    {% if "Sports" in clothing.occasion %}checked{% endif %}
                >
                Sports
            </label>

            <br>

            <label>
                <input
                    type="checkbox"
                    name="occasion"
                    value="Travel"
                    {% if "Travel" in clothing.occasion %}checked{% endif %}
                >
                Travel
            </label>

        </div>

        <br><br>


        <button type="submit">Update Clothing</button>

    </form>

    <br>

    <a href="/wardrobe/">Back to Wardrobe</a>

</body>

</html>
