<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
</head>

<body>

    <h1>My Profile</h1>

    <p>
        Username: {{ profile.user.username }}
    </p>

    {% if profile.profile_picture %}
        <img src="{{ profile.profile_picture.url }}" width="150">
    {% endif %}

    <a href="/wardrobe/">
        <button>My Wardrobe</button>
    </a>

    <br><br>

    <a href="/edit-profile/">
    <button>Edit Profile</button>
    </a>

    <a href="/">
        ← Back to Home
    </a>

</body>
</html>
