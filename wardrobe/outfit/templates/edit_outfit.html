<!DOCTYPE html>
<html>
<head>

    <title>Edit Outfit</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #ffd6e5;
            padding: 20px 40px;
        }

        .navbar h2 {
            display: inline;
            margin-right: 30px;
        }

        .navbar a {
            color: black;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .items {
            margin-top: 15px;
        }

        .item {
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
        }

        .item input {
            margin-right: 8px;
        }

        .update-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #222;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>Wardrobe Planner</h2>

        <a href="/">Home</a>

        <a href="/wardrobe/">Wardrobe</a>

        <a href="/outfit-planner/">Outfits</a>

        <a href="/profile/">Profile</a>

    </div>


    <div class="container">

        <h1>Edit Outfit</h1>


        <form method="POST">

            {% csrf_token %}


            <label>Outfit Name:</label>

            <input
                type="text"
                name="name"
                value="{{ outfit.name }}"
                required
            >


            <br><br>


            <label>Description:</label>

            <textarea
                name="description"
                placeholder="Describe your outfit"
            >{{ outfit.description }}</textarea>


            <br><br>


            <label>Select Clothing Items:</label>


            <div class="items">

                {% for item in clothing_items %}

                    <div class="item">

                        <label>

                            <input
                                type="checkbox"
                                name="clothing_items"
                                value="{{ item.id }}"
                                {% if item in outfit.clothing_items.all %}
                                    checked
                                {% endif %}
                            >

                            {{ item.name }} - {{ item.category }}

                        </label>

                    </div>

                {% empty %}

                    <p>No clothing items available.</p>

                {% endfor %}

            </div>


            <button
                type="submit"
                class="update-button"
            >
                Update Outfit
            </button>

        </form>


        <a
            class="back"
            href="/outfit-planner/"
        >
            ← Back to Outfit Planner
        </a>

    </div>

</body>
</html>
